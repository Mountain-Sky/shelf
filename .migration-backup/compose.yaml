services:
  shelf:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      SHELF_ACCESS: private
      DEMO_ACCESS_PASSWORD: ${DEMO_ACCESS_PASSWORD:?Set a reviewer password of at least 16 characters}
      SHELF_PUBLIC_ORIGIN: ${SHELF_PUBLIC_ORIGIN:-http://127.0.0.1:3000}
      SHELF_INSPECTOR: "0"
    volumes:
      - shelf-demo-catalog:/data
    restart: unless-stopped
    init: true
volumes:
  shelf-demo-catalog:
