openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /chat:
    post:
      operationId: discoverBooks
      summary: Search or refine a versioned library discovery session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryInput"
      responses:
        "200":
          description: Books, preferences, and a versioned session; no durable history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResult"
        "400":
          description: Invalid request
        "403":
          description: Cross-origin request denied
        "409":
          description: Stale session revision
        "410":
          description: Session expired
        "413":
          description: Body exceeds 8000 bytes
        "503":
          description: Discovery unavailable
  /catalog/search:
    get:
      operationId: searchCatalog
      summary: Search without conversation or model configuration
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 500 }
        - in: query
          name: branch
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Catalog search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResult"
        "400":
          description: Invalid query or branch
        "503":
          description: Catalog unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    DiscoveryInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 500 }
        branch: { type: string }
        action: { type: string, enum: [search, branch, similar] }
        selectedResultId: { type: string, maxLength: 1000 }
        session:
          $ref: "#/components/schemas/DiscoverySession"
    DiscoverySession:
      type: object
      required: [id, revision]
      properties:
        id: { type: string }
        revision: { type: integer, minimum: 1 }
    CatalogBook:
      type: object
      description: Original provider-neutral ResultBook; full edition and availability contracts are in shelf-core/lib/types.ts
      additionalProperties: true
    CatalogResult:
      type: object
      required: [books, source, notices]
      properties:
        books:
          type: array
          items:
            $ref: "#/components/schemas/CatalogBook"
        source: { type: string }
        notices: { type: array, items: { type: string } }
    DiscoveryResult:
      allOf:
        - $ref: "#/components/schemas/CatalogResult"
        - type: object
          required: [session, branch, preferences]
          properties:
            session:
              $ref: "#/components/schemas/DiscoverySession"
            branch: { type: string }
            preferences: { type: object, additionalProperties: true }
            reply: { type: string }
            actions: { type: array, items: { type: string } }
            trace: { type: object, additionalProperties: true }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

